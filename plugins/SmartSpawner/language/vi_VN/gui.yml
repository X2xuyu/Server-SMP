gui_title_main:
  single_spawner: ʟồɴɢ sᴘᴀᴡɴ %ᴇɴᴛɪᴛʏ%
  stacked_spawner: '%amount% ʟồɴɢ sᴘᴀᴡɴ %ᴇɴᴛɪᴛʏ%'

spawner_storage_item:
  # Các placeholder khả dụng cho tên:
  # {max_slots} - Số ô tối đa trong kho (có dấu phẩy)
  # {current_items} - Số vật phẩm hiện có trong kho
  # {percent_storage_rounded} - Phần trăm dung lượng đã dùng (0-100)
  # {entity} - Loại mob của spawner (viết thường/hoa chuẩn)
  # {ᴇɴᴛɪᴛʏ} - Loại mob của spawner (chữ nhỏ caps)
  name: '&#fce96aᴋʜᴏ ᴄʜứᴀ'
  
  # Các placeholder khả dụng cho mọi dòng lore:
  # {max_slots} - Số ô tối đa trong kho (có dấu phẩy)
  # {current_items} - Số vật phẩm hiện có trong kho
  # {percent_storage_rounded} - Phần trăm dung lượng đã dùng (0-100)
  # {loot_items} - Danh sách vật phẩm rơi đầy đủ
  # {entity} - Loại mob của spawner (viết thường/hoa chuẩn)
  # {ᴇɴᴛɪᴛʏ} - Loại mob của spawner (chữ nhỏ caps)
  lore:
  - ''
  - '&#d9b50c◈ &#fce96aᴛʜôɴɢ ꜱố:'
  - '  &#f8f8ff•  ô: &#f9cf51%current_items%&#d9b50c/&#f9cf51%max_slots%'
  - '  &#f8f8ff•  ᴋʜᴏ ᴄʜứᴀ: &#f9cf51%percent_storage%%&#f8f8ff đầʏ'
  - ''
  - '&#d9b50c⊳ &#f8f8ffɴʜấᴘ để ᴍở ᴋʜᴏ'
  # Có thể thêm dòng hiển thị toàn bộ vật phẩm rơi:
  # - '{loot_items}'

    # Định nghĩa cách mỗi vật phẩm rơi sẽ hiển thị khi dùng {loot_items}
  # Các placeholder khả dụng cho từng vật phẩm rơi:
  # {item_name} - Tên vật phẩm (viết chuẩn)
  # {ɪᴛᴇᴍ_ɴᴀᴍᴇ} - Tên vật phẩm (chữ nhỏ caps)
  # {amount} - Số lượng vật phẩm (có dấu phẩy)
  # {raw_amount} - Số lượng vật phẩm (không định dạng)
  # {chance} - Tỉ lệ rơi vật phẩm này (có ký hiệu %, ví dụ: "8.5%")
  loot_items: '  &#bdc3c7•  &#2ecc71{amount} &#bdc3c7{ɪᴛᴇᴍ_ɴᴀᴍᴇ}'
  loot_items_empty: '  &#bdc3c7•  ᴋʜôɴɢ ᴄó'

# Spawner Info Item Configuration
# Available placeholders:
#
# Entity Information:
# {entity}           - Formatted entity name (e.g., "Zombie")
# {ᴇɴᴛɪᴛʏ}           - Entity name in small caps (e.g., "ᴢᴏᴍʙɪᴇ")
# {entity_type}      - Raw entity type (e.g., "ZOMBIE")
#
# Stack Information:
# {stack_size}       - Number of spawners stacked at this location
#
# Spawner Settings:
# {range}            - Spawning range in blocks
# {delay}            - Spawn delay in seconds
# {min_mobs}         - Minimum number of mobs to spawn
# {max_mobs}         - Maximum number of mobs to spawn
#
# Storage Information:
# {current_items}    - Current number of items stored
# {max_items}        - Maximum storage capacity for items
# {percent_storage_rounded}  - Storage usage as integer percentage (e.g., "87")
# {percent_storage_decimal} - Storage usage as formatted percentage with decimal (e.g., "87.5")
#
# Experience Information:
# {current_exp}      - Current experience stored (formatted with commas)
# {max_exp}          - Maximum experience capacity (formatted with commas)
# {raw_current_exp}  - Raw current experience number
# {raw_max_exp}      - Raw maximum experience number
# {percent_exp_rounded}      - Experience storage as integer percentage
# {percent_exp_decimal}    - Experience storage as formatted percentage with decimal (e.g., "42.7")
